# herdr-shadow-pane — broadcast your keystrokes as a shadow across herdr panes
#
# tmux-style synchronize-panes for herdr, as a plugin.
# The `sync` action is a thin launcher: it opens the console as a
# herdr-managed overlay pane. The real TUI runs as the `console` pane
# entrypoint; herdr tears the pane down when the process exits.
# herdr spawns plugin commands with CWD = plugin root, so relative
# `./bin/...` paths resolve; bare command names would not.
#
# Local development:
#   cargo build --release && mkdir -p bin && cp target/release/herdr-shadow-pane bin/
#   herdr plugin link .
#
# Install from GitHub:
#   herdr plugin install <owner>/herdr-shadow-pane

id = "shaozk.herdr-shadow-pane"
name = "Shadow Pane"
version = "0.7.1"
min_herdr_version = "0.8.0"
description = "tmux-style synchronize-panes: broadcast keystrokes to all other panes of the current tab."
platforms = ["linux", "macos"]

[[build]]
platforms = ["linux", "macos"]
command = ["sh", "scripts/build.sh"]

[[actions]]
id = "sync"
title = "Shadow Pane: broadcast keystrokes"
platforms = ["linux", "macos"]
command = ["./bin/herdr-shadow-pane", "launch"]

[[panes]]
id = "console"
title = "Shadow Pane"
placement = "overlay"
platforms = ["linux", "macos"]
command = ["./bin/herdr-shadow-pane"]
